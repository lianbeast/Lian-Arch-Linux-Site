<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arch Linux — A lightweight, flexible distribution for the competent. Interactive 3D experience showcasing Arch Linux features, installation, pacman, and community." />
    <meta name="theme-color" content="#050a12" />
    <title>Arch Linux — Interactive 3D Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Ubuntu+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Local display font (served from public/fonts, relative so it survives subpath hosting) */
      @font-face {
        font-family: 'Orbitron';
        src: url('./fonts/Orbitron.ttf') format('truetype');
        font-display: swap;
        font-weight: 400 900;
      }
      /* Visually-hidden but screen-reader accessible */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      /* Keyboard skip-nav link: off-screen until keyboard-focus lands */
      .skip-link {
        position: absolute;
        top: -100px;
        left: 1rem;
        background: #00d4ff;
        color: #000;
        padding: 0.6rem 1rem;
        border-radius: 6px;
        font: 700 0.95rem/1 'Chakra Petch', system-ui, sans-serif;
        text-decoration: none;
        z-index: var(--z-skip-link, 9000);
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.45);
        transition: top 0.2s ease;
      }
      .skip-link:focus { top: 1rem; outline: 2px solid #fff; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { .skip-link { transition: none; } }  </style>
</head>
  <body>
    <a href="#root" class="skip-link">Skip to main content</a>
    <h1 class="sr-only">Arch Linux — Interactive 3D Experience</h1>
    <main id="root" tabindex="-1"></main>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
