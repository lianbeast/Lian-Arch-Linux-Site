<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Arch Linux — you decide what belongs</title>
    <meta
      name="description"
      content="A lightweight, rolling-release Linux distribution for the self-directed. Rolling releases, pacman, the AUR, and the wiki."
    />
    <link rel="canonical" href="https://lianbeast.github.io/Lian-Arch-Linux-Site/" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050507" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Preload only the two faces that paint above the fold. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/SpaceGrotesk-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/JetBrainsMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arch Linux" />
    <meta property="og:title" content="Arch Linux — you decide what belongs" />
    <meta
      property="og:description"
      content="A lightweight, rolling-release Linux distribution for the self-directed."
    />
    <meta property="og:url" content="https://lianbeast.github.io/Lian-Arch-Linux-Site/" />
    <!--
      Absolute, not %BASE_URL%-relative. Social crawlers do not reliably resolve
      relative og:image paths — Facebook guesses against og:url, Twitter and
      LinkedIn reject them outright. This requires demo.png to live in public/
      so its path is stable and unhashed. See the note in README.md.
    -->
    <meta property="og:image" content="https://lianbeast.github.io/Lian-Arch-Linux-Site/demo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="900" />
    <!-- Describes the page, not a frame: the screenshot gets re-shot. See README.md. -->
    <meta property="og:image:alt" content="The Arch Linux landing page." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arch Linux — you decide what belongs" />
    <meta
      name="twitter:description"
      content="A lightweight, rolling-release Linux distribution for the self-directed."
    />
    <meta name="twitter:image" content="https://lianbeast.github.io/Lian-Arch-Linux-Site/demo.png" />

    <!--
      Honest shape: this page is *about* Arch Linux, it is not the project's own
      site. So the page is a WebPage whose `about` is the SoftwareApplication,
      and that application's url is archlinux.org — not this GitHub Pages URL.
      No invented ratings, download counts or release versions.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Arch Linux — you decide what belongs",
      "description": "A lightweight, rolling-release Linux distribution for the self-directed.",
      "url": "https://lianbeast.github.io/Lian-Arch-Linux-Site/",
      "inLanguage": "en",
      "isAccessibleForFree": true,
      "about": {
        "@type": "SoftwareApplication",
        "name": "Arch Linux",
        "applicationCategory": "OperatingSystem",
        "operatingSystem": "Linux",
        "url": "https://archlinux.org/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    }
    </script>

    <style>
      /* Self-hosted, no CDN. Three families site actually uses. */
      @font-face {
        font-family: 'Space Grotesk';
        src: url('%BASE_URL%fonts/SpaceGrotesk-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('%BASE_URL%fonts/SpaceGrotesk-Medium.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('%BASE_URL%fonts/SpaceGrotesk-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('%BASE_URL%fonts/JetBrainsMono-Variable.woff2') format('woff2');
        font-weight: 100 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Agave';
        src: url('%BASE_URL%fonts/Agave-Regular-zeroslashed-parenbulged.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }

      /* Pre-mount fallback. Deliberately inline and dependency-free so it
         survives a failed stylesheet, and delayed so it never flashes when
         the app boots normally. */
      .boot {
        max-width: 44rem;
        margin: 0 auto;
        padding: 5rem 1.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.875rem;
        line-height: 1.7;
        color: #a2a8af;
        opacity: 0;
        animation: boot-in 200ms ease 1200ms forwards;
      }
      .boot h1 {
        margin: 0 0 0.75rem;
        font-size: 1.125rem;
        font-weight: 500;
        color: #e7e8ea;
      }
      .boot p { margin: 0 0 0.5rem; }
      .boot a { color: #6cc0e8; }
      @keyframes boot-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        /* Keep the 1200ms delay, drop the fade. */
        .boot { animation-duration: 1ms; }
      }
    </style>

    <noscript>
      <!-- Scroll reveals start hidden and are shown by JavaScript. Without JS
           there is nothing to reveal them, so force them visible. -->
      <style>
        .reveal, .reveal-stagger > * {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Replaced by React on mount (see src/main.jsx). If the bundle fails to
         load, this is what the reader sees instead of an empty black page. -->
    <div id="root">
      <div class="boot">
        <h1>Arch Linux</h1>
        <p>Loading the page…</p>
        <p>
          If this message stays on screen, the script bundle failed to load.
          Try a hard reload, or read
          <a href="https://wiki.archlinux.org/">the wiki</a> meanwhile.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
